[project]
name = "banxopen-foundation"
description = "BANxOpen Foundation: shared data model, rule-engine shape, part requirements, NX plumbing and the UI kit."
dynamic = ["version"]
requires-python = "==3.11.*"          # must match NX 2412's embedded Python
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "pyright", "import-linter", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/banxopen/foundation/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/banxopen"]

[tool.ruff]
target-version = "py311"
line-length = 120               # the team's C# column width
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "PTH", "TID", "RUF", "BLE", "ANN"]
ignore = ["ANN401"]                   # Any is allowed at NX boundaries (with a comment)

[tool.ruff.lint.isort]
known-first-party = ["banxopen"]
known-local-folder = ["builders"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["ANN", "BLE"]
"**/*_generated.py" = ["ALL"]

[tool.ruff.format]
exclude = ["**/*_generated.py"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
strict = ["src/banxopen/foundation/model", "src/banxopen/foundation/core", "src/banxopen/foundation/ui/messenger.py"]
stubPath = "typings"                  # junction to %UGII_BASE_DIR%\UGOPEN\pythonStubs (see README)
reportMissingModuleSource = false     # NXOpen has stubs but no source outside NX
ignore = ["**/*_generated.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = ["nx: needs a running NX session (excluded from CI)"]

[tool.coverage.run]
source = ["banxopen.foundation"]
omit = ["*/nx_adapters/*", "*/ui/nx_messenger.py", "*/ui/callbacks.py", "*/ui/block_reader.py"]

[tool.importlinter]
root_packages = ["banxopen.foundation"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: ui -> nx_adapters -> core -> model"
type = "layers"
layers = [
    "banxopen.foundation.ui",
    "banxopen.foundation.nx_adapters",
    "banxopen.foundation.core",
    "banxopen.foundation.model",
]

[[tool.importlinter.contracts]]
name = "No NXOpen in core or model"
type = "forbidden"
source_modules = ["banxopen.foundation.core", "banxopen.foundation.model", "banxopen.foundation.ui.messenger", "banxopen.foundation.ui.tree_rows"]
forbidden_modules = ["NXOpen"]
allow_indirect_imports = true

